[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "peek-app-utilities"
version = "0.9.4"
description = "Python SDK for the Peek, CNG, and ACME backoffice APIs — the Python port of @peektravel/app-utilities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Peek Travel" }]
keywords = ["peek", "peek-pro", "booking", "sdk", "async"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyJWT>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/peek-travel/app-utilities-py"
Repository = "https://github.com/peek-travel/app-utilities-py"
Changelog = "https://github.com/peek-travel/app-utilities-py/blob/main/changelog.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "mypy>=1.11",
  "ruff>=0.6",
  "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peek_app_utilities"]

[tool.hatch.build.targets.sdist]
include = ["src/peek_app_utilities", "README.md", "changelog.md", "llms.txt", "docs/webhooks.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "ANN", "N", "SIM", "T20"]
ignore = [
  "ANN401",  # Any is legitimate at the raw-payload boundary
  "RUF012",  # mutable class attrs are not used for state here
  "E501",    # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "RUF029", "B011"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["peek_app_utilities"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# Tests splat option dicts and poke at fakes; keep them loosely typed.
disable_error_code = ["arg-type", "union-attr", "type-arg", "unreachable", "attr-defined"]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error",
  # Tests sign with short throwaway secrets on purpose.
  "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

[tool.coverage.run]
source = ["peek_app_utilities"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.$",
  "raise AssertionError",
]
