<style>

    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3441;

    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --c-com:#8b949e; --c-str:#a5d6ff; --c-num:#79c0ff; --c-kw:#ff7b72; --c-lit:#79c0ff; --c-con:#79c0ff; --c-cls:#ffa657; --c-fn:#d2a8ff;
  }
  html[data-theme="light"]{
    --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef1f5; --border:#d0d7de;
    --text:#1f2328; --muted:#59636e; --accent:#0969da; --accent2:#1a7f37;
    --type:#0550ae; --null:#bc4c00; --danger:#cf222e; --pii:#8250df;
    --c-com:#6e7781; --c-str:#0a3069; --c-num:#0550ae; --c-kw:#cf222e; --c-lit:#0550ae; --c-con:#0550ae; --c-cls:#953800; --c-fn:#8250df;
  }
  html[data-theme="light"] .desc,
  html[data-theme="light"] .ctor,
  html[data-theme="light"] .notes li,
  html[data-theme="light"] .sig,
  html[data-theme="light"] .example{color:#24292f}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex}
  a{color:var(--accent);text-decoration:none}
  code,.mono{font-family:var(--mono)}

  #brand{padding:18px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}

  .themebtn:hover{border-color:var(--accent);color:var(--accent)}
  #search{width:100%;margin-top:12px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px}
  .navgroup{padding:14px 12px 4px 20px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}

  /* main */

  .example{font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:6px 0 14px;color:#c9d1d9}
  .example .t-com{color:var(--c-com);font-style:italic}
  .example .t-str{color:var(--c-str)}
  .example .t-num{color:var(--c-num)}
  .example .t-kw{color:var(--c-kw)}
  .example .t-lit{color:var(--c-lit)}
  .example .t-con{color:var(--c-con)}
  .example .t-cls{color:var(--c-cls)}
  .example .t-fn{color:var(--c-fn)}
  .notes{list-style:none;padding:0;margin:6px 0 12px}
  .notes li{padding:6px 10px 6px 28px;position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:6px;margin:5px 0;font-size:12.5px;color:#c9d1d9}
  .notes li:before{content:"›";position:absolute;left:11px;color:var(--accent);font-weight:700}
  table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:13px}
  th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2)}
  .m-name{font-family:var(--mono);color:var(--accent);white-space:nowrap;font-weight:600}
  .sig{font-family:var(--mono);color:#c9d1d9;font-size:12px}
  .type{font-family:var(--mono);color:var(--type);font-size:12.5px}
  a.mlink{color:var(--accent);text-decoration:none;border-bottom:1px dashed #58a6ff66;cursor:pointer}
  a.mlink:hover{border-bottom-style:solid;color:#79c0ff}
  .type a.mlink{color:var(--type);border-bottom-color:#79c0ff66}
  .null-y{color:var(--null);font-weight:600}
  .null-n{color:var(--muted)}
  .subhead{margin:20px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .hidden{display:none !important}
  .fieldname{font-family:var(--mono);font-weight:600}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
  .badge.opt{background:#30363d;color:var(--muted)}
  .badge.inh{background:#1f6feb22;color:var(--muted);border:1px solid var(--border);font-weight:500}
  .extends{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
  tr.inh-row .fieldname{opacity:.92}
  .empty{color:var(--muted);font-style:italic;padding:12px 0}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px;border:2px solid var(--bg)}
</style>

<body>
<nav id="sidebar">
  <div id="brand">
    <h1>Peek Platform</h1>

    <span class="pkgbadge">Python · PyPI package</span>
    <div class="links">
      <a href="../index.html">← Home</a>
      <button id="themeBtn" class="themebtn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>

  <div id="nav"></div>

<main id="main">
  <div id="hero">
    <h2 id="heroTitle"></h2>
    <p id="heroSub"></p>
  </div>
  <div id="content"></div>
</main>
<script>
/* ---------- shared renderer ---------- */
function nullCell(n){return n===true?'<span class="null-y">nullable</span>':n==="opt"?'<span class="null-y">optional</span>':'<span class="null-n">—</span>';}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function slug(s){return s.replace(/[^a-zA-Z0-9]+/g,'-');}
let LINK_RE=null,LINK_MAP=null;
function linkify(str){
  if(!str||!LINK_RE)return str;
  return str.replace(LINK_RE,m=>'<a class="mlink" href="#'+LINK_MAP[m]+'">'+m+'</a>');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlight(code){
  var pats=[
    ['com',/#[^\n]*/],
    ['str',/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/],
    ['num',/\b\d[\d_]*(?:\.\d+)?\b/],
    ['kw',/\b(?:import|from|as|async|await|def|return|if|elif|else|for|in|with|class|lambda|not|and|or|is|raise|try|except|finally|pass|yield|while|del|assert)\b/],
    ['lit',/\b(?:True|False|None|self|cls)\b/],
    ['con',/\b[A-Z][A-Z0-9_]+\b/],
    ['cls',/\b[A-Z][\w$]*\b/],
    ['fn',/[A-Za-z_$][\w$]*(?=\s*\()/],
    ['id',/[A-Za-z_$][\w$]*/],
    ['pun',/[{}()\[\].;,:=<>|&?!+\-*\/]/],
    ['ws',/\s+/],
    ['any',/[\s\S]/]
  ];
  var master=new RegExp(pats.map(function(p){return '('+p[1].source+')';}).join('|'),'g');
  var out='';
  code.replace(master,function(m){
    var g=Array.prototype.slice.call(arguments,1,1+pats.length);
    var i=g.findIndex(function(x){return x!==undefined;});
    var cls=pats[i][0];
    if(cls==='ws') out+=m;
    else if(cls==='id'||cls==='pun'||cls==='any') out+=esc(m);
    else out+='<span class="t-'+cls+'">'+esc(m)+'</span>';
    return m;
  });
  return out;
}

function render(DATA){
  document.title = DATA.title+" Platform — peek-app-utilities";
  heroTitle.textContent = DATA.hero;
  heroSub.innerHTML = DATA.heroSub;
  // sort: root *AccessService first, other services A–Z; models A–Z;
  // methods within each service A–Z
  DATA.services.sort((a,b)=>{
    const ra=/AccessService$/.test(a.name), rb=/AccessService$/.test(b.name);
    if(ra!==rb)return ra?-1:1;
    return a.name.localeCompare(b.name);
  });
  DATA.services.forEach(s=>{if(s.methods)s.methods.sort((a,b)=>a.name.localeCompare(b.name));});
  DATA.models.sort((a,b)=>a.name.localeCompare(b.name));
  LINK_MAP={};
  DATA.models.forEach(m=>{LINK_MAP[m.name]='mdl-'+slug(m.name);});
  DATA.services.forEach(x=>{LINK_MAP[x.name]='svc-'+slug(x.name);});
  const _names=Object.keys(LINK_MAP).sort((a,b)=>b.length-a.length);
  LINK_RE=new RegExp('\\b('+_names.join('|')+')\\b','g');
  const nav=document.getElementById('nav'), content=document.getElementById('content');

  const _isAccess=s=>/AccessService$/.test(s.name);
  const _access=DATA.services.filter(_isAccess), _rest=DATA.services.filter(s=>!_isAccess(s));
  function _navSvc(s){const a=el('a','navitem');a.dataset.target='svc-'+slug(s.name);a.innerHTML='<span class="k">'+s.name+'</span>';nav.appendChild(a);}
  if(_access.length){nav.appendChild(el('div','navgroup','Access Service'));_access.forEach(_navSvc);}
  if(_rest.length){nav.appendChild(el('div','navgroup','Service Classes'));_rest.forEach(_navSvc);}
  nav.appendChild(el('div','navgroup','Data Models'));
  DATA.models.forEach(m=>{
    const a=el('a','navitem');a.dataset.target='mdl-'+slug(m.name);
    a.innerHTML='<span class="k">'+m.name+'</span>';nav.appendChild(a);
  });

  // services
  DATA.services.forEach(s=>{
    const c=el('section','card');c.id='svc-'+slug(s.name);c.dataset.search=(s.name+' '+s.desc).toLowerCase();
    let h='<h3>'+s.name+' <span class="pill svc">service</span></h3>';
    h+='<div class="file">'+s.file+'</div>';
    if(s.desc)h+='<div class="desc">'+s.desc+'</div>';
    if(s.ctor)h+='<div class="subhead">Constructor</div><div class="ctor">'+linkify(s.ctor)+'</div>';
    if(s.obtain)h+='<div class="subhead">Obtain</div><div class="ctor">'+linkify(s.obtain)+'</div>';
    if(s.notes&&s.notes.length){h+='<div class="subhead">Behavior</div><ul class="notes">'+s.notes.map(n=>'<li>'+n+'</li>').join('')+'</ul>';}
    if(s.example)h+='<div class="subhead">Example</div><pre class="example">'+highlight(s.example)+'</pre>';
    if(s.methods&&s.methods.length){
      h+='<div class="subhead">Methods</div><table><thead><tr><th>Method</th><th>Signature</th><th>Description</th></tr></thead><tbody>';
      s.methods.forEach(m=>{
        let notes=m.notes?'<div style="margin-top:6px;color:var(--muted);font-size:12px">'+m.notes+'</div>':'';
        let pii=m.pii?' <span class="pill pii">PII-gated</span>':'';
        h+='<tr><td class="m-name">'+m.name+pii+'</td><td class="sig">'+linkify(m.sig)+'</td><td>'+m.desc+notes+'</td></tr>';
      });
      h+='</tbody></table>';
    }
    c.innerHTML=h;content.appendChild(c);
  });

  // models
  const MBN={}; DATA.models.forEach(m=>{MBN[m.name]=m;});
  function resolveFields(m){
    const rows=(m.fields||[]).map(f=>({f,from:null}));
    const seen=new Set([m.name]); let pn=m.extends;
    while(pn && !seen.has(pn)){seen.add(pn);const p=MBN[pn];if(!p)break;(p.fields||[]).forEach(f=>rows.push({f,from:p.name}));pn=p.extends;}
    return rows;
  }
  DATA.models.forEach(m=>{
    const c=el('section','card');c.id='mdl-'+slug(m.name);c.dataset.search=(m.name+' '+(m.desc||'')+' '+(m.extends||'')).toLowerCase();
    let h='<h3>'+m.name+' <span class="pill model">'+(m.kind||'model')+'</span></h3>';
    if(m.file)h+='<div class="file">'+m.file+'</div>';
    if(m.desc)h+='<div class="desc">'+m.desc+'</div>';
    if(m.extends)h+='<div class="extends">Extends '+linkify(m.extends)+'</div>';
    if(m.def)h+='<div class="ctor">'+linkify(m.def)+'</div>';
    const rows=resolveFields(m);
    if(rows.length){
      h+='<table><thead><tr><th>Field</th><th>Type</th><th>Nullability</th><th>Description</th></tr></thead><tbody>';
      rows.forEach(r=>{
        const f=r.f;
        const inh=r.from?' <span class="badge inh">inherited from '+linkify(r.from)+'</span>':'';
        h+='<tr'+(r.from?' class="inh-row"':'')+'><td class="fieldname">'+f.name+inh+'</td><td class="type">'+linkify(f.type)+'</td><td>'+nullCell(f.n)+'</td><td>'+f.desc+'</td></tr>';
      });
      h+='</tbody></table>';
    }
    c.innerHTML=h;content.appendChild(c);
  });

  // nav interactions
  const items=[...document.querySelectorAll('.navitem')];
  items.forEach(a=>a.addEventListener('click',()=>{
    const t=document.getElementById(a.dataset.target);
    if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
  }));
  const cards=[...document.querySelectorAll('section.card')];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){
      const id=e.target.id;items.forEach(a=>a.classList.toggle('active',a.dataset.target===id));
    }});
  },{rootMargin:'-10% 0px -80% 0px'});
  cards.forEach(c=>io.observe(c));

  // model cross-links
  document.addEventListener('click',ev=>{
    const a=ev.target.closest&&ev.target.closest('.mlink');if(!a)return;
    ev.preventDefault();
    const t=document.getElementById(a.getAttribute('href').slice(1));
    if(t){const sb=document.getElementById('search');if(sb&&sb.value){sb.value='';sb.dispatchEvent(new Event('input'));}
      t.scrollIntoView({behavior:'smooth',block:'start'});}
  });

  // theme toggle (+ carry the choice across the sibling pages via ?theme=,
  // since file:// localStorage is isolated per page in some browsers)
  function _syncThemeLinks(t){
    document.querySelectorAll('#brand .links a').forEach(a=>{
      a.setAttribute('href', a.getAttribute('href').split('?')[0]+'?theme='+t);
    });
  }
  _syncThemeLinks(document.documentElement.getAttribute('data-theme')||'light');
  const _tb=document.getElementById('themeBtn');
  if(_tb)_tb.addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',cur);
    try{localStorage.setItem('theme',cur);}catch(e){}
    _syncThemeLinks(cur);
  });

  // search
  document.getElementById('search').addEventListener('input',ev=>{
    const q=ev.target.value.trim().toLowerCase();
    cards.forEach(c=>{
      const show=!q||c.dataset.search.includes(q);
      c.classList.toggle('hidden',!show);
      const a=document.querySelector('.navitem[data-target="'+c.id+'"]');
      if(a)a.classList.toggle('hidden',!show);
    });
  });
}
</script>

<script>
/* ---------- PEEK DATA ---------- */
render({
 title:"Peek",
 hero:"Peek Platform",
 heroSub:"Rooted at <code>PeekAccessService</code>, which lazily hands out memoized per-resource service classes, each reached through a shared authenticated client. Every I/O method is <code>async</code>; every result is a frozen dataclass. Public model types live in <code>peek_app_utilities.models.peek</code> and are re-exported from the package root. The <code>full_customer_access</code> flag (default off) gates customer PII: PII-marked methods raise <code>PiiAccessDisabledError</code> before any network call, and PII fields are omitted from reads.",
 services:[
  {
   name:"PeekAccessService",
   file:"src/peek_app_utilities/peek_access_service.py",
   desc:"The public entry point. Construct one per install with a <code>PeekAccessServiceConfig</code>. Validates the config and hands out the per-resource service classes through its <code>get_…_service()</code> accessors (lazily created and memoized), all bound to one shared authenticated client (a <code>GraphQLClient</code>) that mints and caches a short-lived JWT on demand. Supports <code>async with</code>, which closes the package-owned HTTP client on exit.",
   ctor:"PeekAccessService(config: PeekAccessServiceConfig)",
   example:"import os\nfrom peek_app_utilities import PeekAccessService, PeekAccessServiceConfig\n\nasync with PeekAccessService(PeekAccessServiceConfig(\n    install_id=\"install_123\",  # from verify_peek_auth_token(token).install_id\n    jwt_secret=os.environ[\"APP_SECRET\"],\n    issuer=\"my-app\",\n    api_url=\"https://apps.peek.com/installations-api/my-app\",  # from the install webhook\n)) as peek:\n    # every product (activities + add-ons) as one flat list\n    products = await peek.get_product_service().get_all_products()",
   methods:[
     {name:"get_product_service",sig:"def get_product_service(self) -&gt; ProductService",desc:"Product service (lazily created + memoized)."},
     {name:"get_account_user_service",sig:"def get_account_user_service(self) -&gt; AccountUserService",desc:"Account-user service."},
     {name:"get_resource_pool_service",sig:"def get_resource_pool_service(self) -&gt; ResourcePoolService",desc:"Resource-pool service."},
     {name:"get_timeslot_service",sig:"def get_timeslot_service(self) -&gt; TimeslotService",desc:"Timeslot service (composed with the resource-pool + account-user services)."},
     {name:"get_reseller_service",sig:"def get_reseller_service(self) -&gt; ResellerService",desc:"Reseller service."},
     {name:"get_promo_code_service",sig:"def get_promo_code_service(self) -&gt; PromoCodeService",desc:"Promo-code service."},
     {name:"get_pricing_service",sig:"def get_pricing_service(self) -&gt; PricingService",desc:"Pricing service."},
     {name:"get_daily_note_service",sig:"def get_daily_note_service(self) -&gt; DailyNoteService",desc:"Daily-note service."},
     {name:"get_availability_service",sig:"def get_availability_service(self) -&gt; AvailabilityService",desc:"Availability service."},
     {name:"get_membership_service",sig:"def get_membership_service(self) -&gt; MembershipService",desc:"Membership service."},
